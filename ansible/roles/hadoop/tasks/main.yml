---
- name: Créer le répertoire d'installation Hadoop
  file:
    path: "{{ install_base_dir }}"
    state: directory
    mode: "0755"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"


- name: Télécharger et extraire Hadoop
  unarchive:
    src: "{{ hadoop_url }}"
    dest: "{{ install_base_dir }}"
    remote_src: yes
    creates: "{{ hadoop_home }}"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"

- name: "Création  manuelle du dossier logs Hadoop avec les bons droits"
  ansible.builtin.file:
    path: "/opt/hadoop/hadoop-2.7.1/logs"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0775'

- name: Configurer HADOOP_HOME et PATH dans le .bashrc
  blockinfile:
    path: "/home/{{ target_user }}/.bashrc"
    marker: "# {mark} ANSIBLE MANAGED BLOCK: HADOOP"
    block: |
      export HADOOP_HOME={{ hadoop_home }}
      export PATH=$HADOOP_HOME/bin:$HADOOP_HOME/sbin:$PATH
    create: yes
    mode: "0644"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"

- name: Déployer hadoop-env.sh sur le NameNode et les DataNodes
  template:
    src: hadoop-env.sh
    dest: "{{ hadoop_home }}/etc/hadoop/hadoop-env.sh"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"

- name: Déployer core-site.xml sur le NameNode
  template:
    src: core-site.xml
    dest: "{{ hadoop_home }}/etc/hadoop/core-site.xml"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"

- name: Déployer hdfs-site.xml sur les DataNode
  template:
    src: hdfs-site.xml
    dest: "{{ hadoop_home }}/etc/hadoop/hdfs-site.xml"
    owner: "{{ target_user }}"

- name: Déployer slaves sur le NameNode
  template:
    src: slaves
    dest: "{{ hadoop_home }}/etc/hadoop/slaves"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
