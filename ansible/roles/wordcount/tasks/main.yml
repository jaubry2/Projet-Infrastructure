---
- name: Créer le répertoire pour le projet
  file:
    path: "{{ install_base_dir }}"
    state: directory
    mode: '0755'
    owner: "{{ target_user }}"
    group: "{{ target_user }}"

- name: Télécharger et extraire le projet à éxécuter
  unarchive:
    src: "{{ wordcount_url }}"
    dest: "{{ install_base_dir }}"
    remote_src: yes
    creates: "{{ wordcount_home }}"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"

- name: Déployer les scripts avec les bonnes permissions
  ansible.builtin.template:
    src: "{{ item.name }}"     
    dest: "{{ wordcount_home }}/{{ item.name }}"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0755'
  loop:
    - { name: 'start.sh', target: 'master' }
    - { name: 'stop.sh', target: 'master' }
    - { name: 'comp.sh', target: 'edge' }
    - { name: 'copy.sh', target: 'edge' }
    - { name: 'generates.sh', target: 'edge' }
    - { name: 'run.sh', target: 'edge' }
  when: item.target in group_names

- name: Télécharger le jeu de données volumineux depuis GCS
  ansible.builtin.get_url:
    url: "https://storage.googleapis.com/logiciel-projet-infra/data.txt"
    dest: "/tmp/data.txt"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: '0644'
    force: no
    timeout: 600
  when: "'edge' in group_names"